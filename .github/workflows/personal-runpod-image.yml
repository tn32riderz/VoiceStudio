# Personal fork only: build the RunPod v1 image.
#
#   ghcr.io/<owner>/voicestudio:v1-base  — deploy/Dockerfile (CUDA), unchanged
#   ghcr.io/<owner>/voicestudio:v1       — base + deploy/runpod/Dockerfile layer
#   ghcr.io/<owner>/voicestudio:v1-<sha> — the same image, pinned to a commit
#
# Runs on pushes to personal/v1 and on demand. Never runs upstream: the job
# is skipped in debpalash/VoiceStudio so a merge back cannot publish anything.

name: Personal RunPod image

on:
  push:
    branches: [personal/v1]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/tests/**"
      - "**/test_*.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: personal-runpod-image-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: github.repository_owner != 'debpalash'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image names
        id: names
        shell: bash
        run: |
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | LC_ALL=C tr 'A-Z' 'a-z')"
          IMAGE="ghcr.io/${OWNER}/voicestudio"
          {
            echo "image=${IMAGE}"
            echo "cache=ghcr.io/${OWNER}/voicestudio-buildcache:v1"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # Same reclaim list as docker.yml: the CUDA build runs at the runner's
      # disk ceiling otherwise.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base (deploy/Dockerfile, CUDA)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            BUILD_COMMIT=${{ steps.names.outputs.commit }}
          push: true
          tags: ${{ steps.names.outputs.image }}:v1-base
          cache-from: type=registry,ref=${{ steps.names.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.names.outputs.cache }},mode=max,ignore-error=true

      - name: Build and push RunPod image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/runpod/Dockerfile
          build-args: |
            BASE_IMAGE=${{ steps.names.outputs.image }}:v1-base
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:v1
            ${{ steps.names.outputs.image }}:v1-${{ steps.names.outputs.short_sha }}
